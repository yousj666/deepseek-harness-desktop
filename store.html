<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 扩展商店</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a22; --card: #1c2029; --border: #2a2f3a;
    --text: #e6e9ef; --dim: #8b93a5; --accent: #4f8cff; --ok: #3ecf8e; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
  header .sub { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .backhint { color: var(--dim); font-size: 12px; white-space: nowrap; margin-left: auto; }
  #search { flex: 1; max-width: 420px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 14px; font-size: 14px; outline: none; }
  #search:focus { border-color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  #statusbar { padding: 8px 24px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--border); }
  #list { padding: 18px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .name { font-size: 15px; font-weight: 600; word-break: break-all; }
  .card .ver { color: var(--dim); font-size: 12px; background: var(--panel); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .card .desc { color: var(--dim); font-size: 13px; line-height: 1.5; min-height: 38px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
  .card .meta .dl { color: var(--ok); }
  .card .actions { display: flex; align-items: center; gap: 10px; }
  .install { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
  .install:hover { filter: brightness(1.1); }
  .install:disabled { background: var(--dim); cursor: default; }
  .installed-tag { color: var(--ok); font-size: 12px; }
  .out { grid-column: 1 / -1; background: #0a0c11; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; max-height: 300px; overflow: auto; color: var(--dim); }
  .prog { display: none; position: relative; height: 16px; background: #232936; border-radius: 8px; overflow: hidden; }
  .prog-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, #3a7bff, #5b9bff); border-radius: 8px; transition: width .35s ease; }
  .prog-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #cfe0ff; }
  #loading { text-align: center; padding: 60px; color: var(--dim); }
  .empty { text-align: center; padding: 60px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>🧩 DSH 扩展商店</h1>
  <span class="sub" id="count"></span>
  <input id="search" type="text" placeholder="搜索扩展（名称/描述）...">
  <button class="btn ghost" id="reload">刷新列表</button>
  <span class="backhint">返回聊天请点窗口顶部「聊天」按钮</span>
</header>
<div id="statusbar" style="display:none;"></div>
<div id="hot" style="padding: 14px 24px 0 24px;"></div>
<div id="list"></div>
<div id="loading">正在从 npm 加载扩展列表...</div>

<script>
const API = location.origin;           // 本地商店服务
const NPM_SEARCH = "https://registry.npmjs.org/-/v1/search?text=keywords:dsh-plugin";
let allPkgs = [];
let installed = new Set();
let searching = false;

document.getElementById('reload').onclick = () => { document.getElementById('list').innerHTML = ''; document.getElementById('loading').style.display = 'block'; loadAll(); };

async function loadInstalled() {
  try {
    const r = await fetch(API + "/installed");
    const j = await r.json();
    installed = new Set(j.packages || []);
  } catch (e) { console.log("installed 查询失败", e); }
}

async function loadAll() {
  const seen = new Map();
  try {
    // 分页拉取 npm 上所有 dsh-plugin 包
    for (let from = 0; from < 1500; from += 250) {
      const r = await fetch(NPM_SEARCH + "&size=250&from=" + from);
      const j = await r.json();
      const objs = j.objects || [];
      for (const o of objs) {
        const p = o.package;
        if (p && p.name && !seen.has(p.name)) seen.set(p.name, p);
      }
      if (objs.length === 0) break;
      document.getElementById('loading').textContent = "正在加载扩展列表... 已获取 " + seen.size + " 个";
    }
  } catch (e) {
    document.getElementById('loading').textContent = "加载失败：" + e.message;
    return;
  }
  allPkgs = Array.from(seen.values()).sort((a, b) => (b.score && b.score.detail ? b.score.detail.popularity : 0) - (a.score && a.score.detail ? a.score.detail.popularity : 0));
  document.getElementById('loading').style.display = 'none';
  render();
}

function makeCard(p) {
  const isInstalled = installed.has(p.name);
  const card = document.createElement('div');
  card.className = 'card';
  const desc = (p.description || "（无描述）").replace(/</g, '&lt;');
  const author = (p.publisher && p.publisher.username) || (p.author && (p.author.name || p.author)) || "未知";
  const dl = p.links && p.links.npm ? '<a href="' + p.links.npm + '" target="_blank" style="color:var(--accent)">npm ↗</a>' : '';
  card.innerHTML = `
    <div class="top"><span class="name">${p.name}</span><span class="ver">v${p.version}</span></div>
    <div class="desc">${desc}</div>
    <div class="meta"><span>👤 ${author}</span>${dl}</div>
    <div class="actions">
      <button class="install" data-name="${p.name}" ${isInstalled ? 'disabled' : ''}>${isInstalled ? '已安装 ✓' : '安装'}</button>
      ${isInstalled ? '<span class="installed-tag">已在本机</span>' : ''}
    </div>
    <div class="prog"><div class="prog-fill"></div><span class="prog-text">0%</span></div>`;
  return card;
}

function render() {
  const kw = (document.getElementById('search').value || "").trim().toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML = '';
  const hot = document.getElementById('hot');
  const filtered = allPkgs.filter(p => {
    if (!kw) return true;
    return (p.name || "").toLowerCase().includes(kw) || (p.description || "").toLowerCase().includes(kw);
  });
  document.getElementById('count').textContent = "共 " + filtered.length + " 个扩展";

  // 热门推荐（无搜索词时显示，取热度 top 6）
  if (!kw && allPkgs.length > 0) {
    const hotTop = allPkgs.slice(0, 6);
    hot.innerHTML = '<h2 style="font-size:15px;margin:0 0 12px 0;color:var(--text);">🔥 热门推荐（全球开发者常用）</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;">' +
      Array.from(hotTop).map(p => {
        const isInstalled = installed.has(p.name);
        return `<div class="card">
          <div class="top"><span class="name">${p.name}</span><span class="ver">v${p.version}</span></div>
          <div class="desc">${(p.description || "（无描述）").replace(/</g, '&lt;')}</div>
          <div class="meta"><span>👤 ${(p.publisher && p.publisher.username) || "未知"}</span></div>
          <div class="actions">
            <button class="install" data-name="${p.name}" ${isInstalled ? 'disabled' : ''}>${isInstalled ? '已安装 ✓' : '安装'}</button>
            ${isInstalled ? '<span class="installed-tag">已在本机</span>' : ''}
          </div>
          <div class="prog"><div class="prog-fill"></div><span class="prog-text">0%</span></div>
        </div>`;
      }).join('') + '</div>';
    hot.style.display = '';
  } else {
    hot.style.display = 'none';
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">没有匹配的扩展</div>';
    return;
  }
  // 全部列表（热门区下面）
  for (const p of filtered) {
    list.appendChild(makeCard(p));
  }
  // 绑定安装按钮
  document.querySelectorAll('#hot .install, #list .install').forEach(btn => {
    if (btn.disabled) return;
    btn.onclick = async () => {
      const name = btn.getAttribute('data-name');
      const card = btn.closest('.card');
      const prog = card.querySelector('.prog');
      const fill = card.querySelector('.prog-fill');
      const ptext = card.querySelector('.prog-text');
      btn.disabled = true;
      btn.textContent = "安装中";
      prog.style.display = 'block';
      fill.style.background = 'linear-gradient(90deg, #3a7bff, #5b9bff)';
      ptext.textContent = "0%";

      let j;
      try {
        j = await (await fetch(API + "/install?name=" + encodeURIComponent(name))).json();
      } catch (e) {
        ptext.textContent = "请求失败"; btn.textContent = "重试"; btn.disabled = false;
        return;
      }
      if (!j.ok) {
        ptext.textContent = "失败"; btn.textContent = "重试"; btn.disabled = false;
        return;
      }
      const taskId = j.taskId;
      let pct = 0;

      const iv = setInterval(async () => {
        let s;
        try {
          s = await (await fetch(API + "/status?taskId=" + encodeURIComponent(taskId))).json();
        } catch (e) { return; }
        if (!s || s.ok === false) { clearInterval(iv); ptext.textContent = "失败"; btn.textContent = "重试"; btn.disabled = false; return; }

        if (s.status === 'success') {
          clearInterval(iv);
          fill.style.width = '100%';
          ptext.textContent = '100%';
          btn.textContent = '已安装 ✓';
          installed.add(name);
          setTimeout(() => { ptext.textContent = '已安装 ✓'; fill.style.background = 'linear-gradient(90deg, #2ea36b, #3ecf8e)'; }, 500);
        } else if (s.status === 'error') {
          clearInterval(iv);
          fill.style.background = 'linear-gradient(90deg, #c73a3f, #ff6b6b)';
          ptext.textContent = '安装失败';
          btn.textContent = '重试';
          btn.disabled = false;
          if (s.output) {
            const out = document.createElement('div');
            out.className = 'out';
            out.textContent = "安装失败，输出：\n" + s.output;
            out.style.color = 'var(--err)';
            card.after(out);
          }
        } else {
          // running：平滑推进，最多到 90%，完成时跳 100
          pct = Math.min(pct + 1.5 + Math.random() * 3, 90);
          fill.style.width = pct + '%';
          ptext.textContent = Math.round(pct) + '%';
        }
      }, 600);
    };
  });
}

document.getElementById('search').addEventListener('input', render);

(async function init() {
  await loadInstalled();
  await loadAll();
})();
</script>
</body>
</html>
